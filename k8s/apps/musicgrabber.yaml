# MusicGrabber - self-hosted music downloader (YouTube, SoundCloud, Monochrome, ...)
# Web UI available at http://pi-cluster.internal:30382 (LAN) or http://musicgrabber.local
#
# Most settings (Navidrome/Jellyfin, notifications, sources, API key) are
# configured from the Settings tab and stored in the SQLite DB on the data PVC.
# Any setting passed as an env var below is locked in the UI.
#
# The app has no login by default: keep it on the LAN, or set an API key /
# admin user in Settings -> Security before exposing it through Cloudflare.
#
# Soulseek source: slskd runs as a sidecar so MusicGrabber can read its
# completed downloads straight off the shared slskd PVC. slskd web UI at
# http://pi-cluster.internal:30530 (LAN) or http://slskd.local.
#
# Pre-requisite: create the slskd secret (Soulseek network account + slskd web
# UI login). A new Soulseek account is registered on first login, so pick an
# unused username:
#
#   kubectl create secret generic slskd-env -n media \
#     --from-literal=SLSKD_SLSK_USERNAME=<soulseek-user> \
#     --from-literal=SLSKD_SLSK_PASSWORD=<soulseek-pass> \
#     --from-literal=SLSKD_USERNAME=<web-user> \
#     --from-literal=SLSKD_PASSWORD=<web-pass> \
#     --from-literal=SLSKD_JWT_KEY=$(openssl rand -hex 32)
#
# Then in MusicGrabber Settings -> Soulseek: URL http://localhost:5030, the
# web user/pass above, downloads path /slskd/downloads, and enable the source.
#
# For better Soulseek results, forward TCP 30534 on your router to any node
# so peers can connect in (it works without, but fewer peers can reach you).
---
apiVersion: v1
kind: Namespace
metadata:
  name: media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: musicgrabber-data-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: musicgrabber-music-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slskd-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: musicgrabber
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: musicgrabber
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: musicgrabber
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: musicgrabber
          image: g33kphr33k/musicgrabber:4.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MUSIC_DIR
              value: /music
            - name: DB_PATH
              value: /data/music_grabber.db
            - name: TZ
              value: Europe/Paris
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /music
            # Headless Chromium fallbacks (Spotify playlists, Monochrome auth) need /dev/shm
            - name: dshm
              mountPath: /dev/shm
            # slskd's completed downloads, imported (copied) into /music
            - name: slskd
              mountPath: /slskd/downloads
              subPath: downloads
          resources:
            requests:
              memory: "192Mi"
              cpu: "50m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
        - name: slskd
          image: slskd/slskd:0.26.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: slskd-http
              containerPort: 5030
              protocol: TCP
            - name: slsk-listen
              containerPort: 30534
              protocol: TCP
          envFrom:
            - secretRef:
                name: slskd-env
          env:
            - name: SLSKD_NO_HTTPS
              value: "true"
            # Listen port must match the NodePort, since peers dial the port we advertise
            - name: SLSKD_SLSK_LISTEN_PORT
              value: "30534"
            # Share completed downloads back to the network; sharing nothing gets you ignored
            - name: SLSKD_SHARED_DIR
              value: /app/downloads
            - name: TZ
              value: Europe/Paris
          volumeMounts:
            - name: slskd
              mountPath: /app
          resources:
            requests:
              memory: "128Mi"
              cpu: "25m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /health
              port: 5030
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 5030
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: musicgrabber-data-pvc
        - name: music
          persistentVolumeClaim:
            claimName: musicgrabber-music-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: slskd
          persistentVolumeClaim:
            claimName: slskd-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: musicgrabber-service
  namespace: media
spec:
  type: NodePort
  selector:
    app: musicgrabber
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30382
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: musicgrabber-ingress
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: musicgrabber.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: musicgrabber-service
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: slskd-service
  namespace: media
spec:
  type: NodePort
  selector:
    app: musicgrabber
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5030
      nodePort: 30530
    - name: slsk-listen
      protocol: TCP
      port: 30534
      targetPort: 30534
      nodePort: 30534
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slskd-ingress
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: slskd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: slskd-service
                port:
                  number: 80
