# MusicGrabber - self-hosted music downloader (YouTube, SoundCloud, Monochrome, ...)
# Web UI available at http://pi-cluster.internal:30382 (LAN) or http://musicgrabber.local
#
# Most settings (Navidrome/Jellyfin, notifications, sources, API key) are
# configured from the Settings tab and stored in the SQLite DB on the data PVC.
# Any setting passed as an env var below is locked in the UI.
#
# The app has no login by default: keep it on the LAN, or set an API key /
# admin user in Settings -> Security before exposing it through Cloudflare.
---
apiVersion: v1
kind: Namespace
metadata:
  name: media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: musicgrabber-data-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: musicgrabber-music-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: musicgrabber
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: musicgrabber
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: musicgrabber
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: musicgrabber
          image: g33kphr33k/musicgrabber:4.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MUSIC_DIR
              value: /music
            - name: DB_PATH
              value: /data/music_grabber.db
            - name: TZ
              value: Europe/Paris
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /music
            # Headless Chromium fallbacks (Spotify playlists, Monochrome auth) need /dev/shm
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              memory: "192Mi"
              cpu: "50m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: musicgrabber-data-pvc
        - name: music
          persistentVolumeClaim:
            claimName: musicgrabber-music-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: musicgrabber-service
  namespace: media
spec:
  type: NodePort
  selector:
    app: musicgrabber
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30382
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: musicgrabber-ingress
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: musicgrabber.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: musicgrabber-service
                port:
                  number: 80
