# OpenClaw - personal AI assistant gateway
# Single-instance gateway that connects to messaging platforms
# (WhatsApp, Telegram, Slack, Discord, etc.) and cloud LLM APIs
# Web UI available at http://openclaw.local (LAN)
# Docs: https://docs.openclaw.ai/
#
# Pre-requisite: create the secret with your OpenRouter API key:
#
#   kubectl create secret generic openclaw-env-secret -n ai \
#     --from-literal=OPENROUTER_API_KEY=sk-or-v1-xxx
#
# Add more keys as needed (OPENAI_API_KEY, TELEGRAM_BOT_TOKEN, etc.)
#
# Note: OpenClaw is single-instance by design (WebSocket state, session store).
# It cannot scale horizontally. The pod can schedule on any node - OpenEBS
# LocalPV binds storage to the node where the pod first lands.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-pvc
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: ai
data:
  openclaw.json: |
    {
      "meta": {
        "lastTouchedVersion": "2026.7.1",
        "lastTouchedAt": "2026-08-21T22:42:00.710Z"
      },
      "gateway": {
        "port": 18789,
        "mode": "local",
        "bind": "loopback",
        "auth": {
          "mode": "none"
        },
        "trustedProxies": ["127.0.0.1/32", "::1/128"],
        "controlUi": {
          "enabled": true,
          "dangerouslyDisableDeviceAuth": true,
          "allowInsecureAuth": true,
          "allowedOrigins": [
            "http://openclaw.local",
            "http://pi-cluster.local:30789",
            "http://192.168.1.191:30789",
            "http://192.168.1.192:30789",
            "http://192.168.1.193:30789",
            "http://192.168.1.194:30789"
          ]
        }
      },
      "channels": {
        "whatsapp": {
          "enabled": true,
          "dmPolicy": "pairing"
        }
      },
      "agents": {
        "defaults": {
          "workspace": "/home/node/.openclaw/workspace",
          "model": {
            "primary": "openrouter/moonshotai/kimi-k3"
          }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  strategy:
    type: Recreate          # PVC is ReadWriteOnce - can't have two pods
  template:
    metadata:
      labels:
        app: openclaw
      annotations:
        checksum/openclaw-config: "3bc7fda65891742b0b3e0ddf0b1de9140a39dca12a2f094b3e9eaad6b14d4409"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 10
      initContainers:
        # Seed config from ConfigMap into PVC on every startup
        - name: init-config
          image: ghcr.io/openclaw/openclaw:2026.7.1-2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /home/node/.openclaw/workspace
              echo "Seeding config from ConfigMap (always overwrite)"
              cp /config/openclaw.json /home/node/.openclaw/openclaw.json
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:2026.7.1-2
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/index.js"]
          args: ["gateway"]
          ports:
            - name: http
              containerPort: 18789
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: npm-cache
              mountPath: /home/node/.npm
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1024"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-env-secret
                  key: OPENROUTER_API_KEY
            - name: YOUTUBE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: openclaw-env-secret
                  key: YOUTUBE_CLIENT_ID
                  optional: true
            - name: YOUTUBE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openclaw-env-secret
                  key: YOUTUBE_CLIENT_SECRET
                  optional: true
            - name: YOUTUBE_TRANSCRIPT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-env-secret
                  key: YOUTUBE_TRANSCRIPT_API_KEY
                  optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1500m"
          readinessProbe:
            httpGet:
              path: /
              port: 18790
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 18790
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /
              port: 18790
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
        - name: lan-proxy
          image: ghcr.io/openclaw/openclaw:2026.7.1-2
          imagePullPolicy: IfNotPresent
          command: ["node", "-e"]
          args:
            - |
              const net = require("node:net");
              const server = net.createServer((client) => {
                const upstream = net.connect(18789, "127.0.0.1");
                client.on("error", () => upstream.destroy());
                upstream.on("error", () => client.destroy());
                client.pipe(upstream);
                upstream.pipe(client);
              });
              server.on("error", (error) => {
                console.error(error);
                process.exit(1);
              });
              server.listen(18790, "0.0.0.0", () => {
                console.log("LAN proxy listening on 0.0.0.0:18790");
              });
          ports:
            - name: proxy
              containerPort: 18790
              protocol: TCP
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=64"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "96Mi"
              cpu: "100m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openclaw-pvc
        - name: config
          configMap:
            name: openclaw-config
        - name: tmp
          emptyDir: {}
        - name: npm-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-service
  namespace: ai
spec:
  type: NodePort
  selector:
    app: openclaw
  ports:
    - protocol: TCP
      port: 80
      targetPort: proxy
      nodePort: 30789
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openclaw-ingress
  namespace: ai
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: openclaw.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openclaw-service
                port:
                  number: 80
