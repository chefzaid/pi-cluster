# Transmute - self-hosted file converter and compressor (images, video, audio,
# documents, spreadsheets, ebooks, diagrams, ...)
# Web UI available at http://pi-cluster.internal:30313 (LAN) or http://transmute.local
#
# Guest access is on: the login page has a one-click "Use as guest" button
# (session cookie lasts 30 days), so day-to-day use needs no account.
#
# Bootstrap with scripts/transmute-bootstrap.sh (also run by install-cluster.sh).
# It creates secret transmute-env (AUTH_SECRET_KEY, ADMIN_USERNAME,
# ADMIN_PASSWORD), applies this manifest and creates the admin account, which
# guest access requires and which would otherwise go to the first visitor.
#
# Uploaded and converted files are cleaned up automatically by Transmute.
---
apiVersion: v1
kind: Namespace
metadata:
  name: utilities
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transmute-pvc
  namespace: utilities
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmute
  namespace: utilities
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: transmute
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: transmute
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: transmute
          image: ghcr.io/transmute-app/transmute:v2.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3313
              protocol: TCP
          env:
            - name: APP_URL
              value: http://pi-cluster.internal:30313
            # Defaults are 5 parallel jobs each; keep video/LibreOffice work within Pi memory
            - name: CONVERSION_WORKER_CONCURRENCY
              value: "2"
            - name: COMPRESSION_WORKER_CONCURRENCY
              value: "2"
            # One-click guest sessions instead of a login
            - name: ALLOW_UNAUTHENTICATED
              value: "true"
            # Fixed signing key so sessions and guest cookies survive restarts
            # (Transmute generates a new random one on every start otherwise)
            - name: AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: transmute-env
                  key: AUTH_SECRET_KEY
            - name: TZ
              value: Europe/Paris
            # Non-root has no writable home in the image; draw.io (Electron) and
            # fontconfig hang or error without one
            - name: HOME
              value: /home/transmute
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: home
              mountPath: /home/transmute
          resources:
            requests:
              memory: "384Mi"
              cpu: "50m"
            limits:
              memory: "1536Mi"
              cpu: "2000m"
          startupProbe:
            httpGet:
              path: /api/health/ready
              port: 3313
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3313
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/ready
              port: 3313
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: transmute-pvc
        - name: home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: transmute-service
  namespace: utilities
spec:
  type: NodePort
  selector:
    app: transmute
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3313
      nodePort: 30313
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transmute-ingress
  namespace: utilities
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: transmute.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: transmute-service
                port:
                  number: 80
