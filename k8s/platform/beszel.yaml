# Beszel - lightweight server monitoring (hub + one agent per node)
# Web UI available at http://pi-cluster.internal:30090 (LAN) or http://beszel.local
#
# Bootstrap with scripts/beszel-bootstrap.sh (also run by install-cluster.sh). It:
#   1. creates secret beszel-hub-env (USER_EMAIL / USER_PASSWORD -> first admin)
#   2. applies this manifest and waits for the hub
#   3. reads the hub public key, registers a permanent universal token and
#      stores both in secret beszel-agent-secret (KEY / TOKEN)
# Agents then connect out to the hub over WebSocket and register themselves,
# one system per node, named after the node.
#
# Per node: CPU, memory, load, temperatures, SD card usage and I/O, network,
# and systemd services (k3s, tailscale, ...). Container stats need a Docker or
# Podman socket, which k3s (containerd) does not provide.
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beszel-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beszel
  namespace: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: beszel
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: beszel
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      containers:
        - name: beszel
          image: henrygd/beszel:0.21.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: APP_URL
              value: http://pi-cluster.internal:30090
            - name: TZ
              value: Europe/Paris
          envFrom:
            - secretRef:
                name: beszel-hub-env
          volumeMounts:
            - name: data
              mountPath: /beszel_data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /api/health
              port: 8090
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8090
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8090
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: beszel-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: beszel-service
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: beszel
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8090
      nodePort: 30090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beszel-ingress
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: beszel.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beszel-service
                port:
                  number: 80
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: beszel-agent
  namespace: monitoring
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: beszel-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: beszel-agent
    spec:
      automountServiceAccountToken: false
      # Host network so the agent sees the node's real interfaces, not the pod veth
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      # Run on every node, including the cordoned control plane
      tolerations:
        - operator: Exists
      containers:
        - name: beszel-agent
          image: henrygd/beszel-agent:0.21.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SYSTEM_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HUB_URL
              value: http://beszel-service.monitoring.svc.cluster.local
            - name: KEY
              valueFrom:
                secretKeyRef:
                  name: beszel-agent-secret
                  key: KEY
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: beszel-agent-secret
                  key: TOKEN
            # Agents dial the hub over WebSocket; no inbound SSH port on the nodes
            - name: DISABLE_SSH
              value: "true"
            # Root disk stats from the SD card rather than the container overlay
            - name: FILESYSTEM
              value: mmcblk0p2
          volumeMounts:
            # Persists the agent fingerprint so a node keeps its identity in the hub
            - name: agent-data
              mountPath: /var/lib/beszel-agent
            # systemd service monitoring
            - name: dbus
              mountPath: /var/run/dbus/system_bus_socket
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            # The default containerd AppArmor profile blocks D-Bus calls to systemd
            appArmorProfile:
              type: Unconfined
          resources:
            requests:
              memory: "24Mi"
              cpu: "10m"
            limits:
              memory: "96Mi"
              cpu: "200m"
      volumes:
        - name: agent-data
          hostPath:
            path: /var/lib/beszel-agent
            type: DirectoryOrCreate
        - name: dbus
          hostPath:
            path: /var/run/dbus/system_bus_socket
            type: Socket
